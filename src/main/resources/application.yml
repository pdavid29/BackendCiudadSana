server:
    port: ${SERVER_PORT:8081}

spring:
    config:
        import: optional:file:.env[.properties]
    autoconfigure:
        exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
    devtools:
        livereload:
            enabled: false
    application:
        name: CiudadSana

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ciudadsana}
        username: ${SPRING_DATASOURCE_USERNAME:ciudadsana}
        password: ${SPRING_DATASOURCE_PASSWORD:}
        driver-class-name: org.postgresql.Driver
        hikari:
            # Retira conexiones inactivas antes de que el pool remoto las cierre.
            max-lifetime: ${DB_POOL_MAX_LIFETIME:1200000}
            keepalive-time: ${DB_POOL_KEEPALIVE_TIME:300000}
            connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
            validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}

    jpa:
        hibernate:
            # La base existente contiene vistas que dependen de columnas como `nombre`.
            # No permitir que Hibernate cambie tipos/ancho de columnas al iniciar.
            ddl-auto: none
        show-sql: ${SPRING_JPA_SHOW_SQL:false}
        properties:
            hibernate:
                format_sql: true
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 6MB

logging:
    level:
        org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:INFO}

app:
    jwt:
        secret: ${APP_JWT_SECRET:}
        expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:30}
    upload-dir: ${APP_UPLOAD_DIR:uploads}
    vision:
        base-url: ${VISION_API_BASE_URL:http://localhost:8000}
        enabled: ${VISION_API_ENABLED:false}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:5500,http://127.0.0.1:5500}
